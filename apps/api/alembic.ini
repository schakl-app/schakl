[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The DB URL is injected from app.config in alembic/env.py (no secrets here).

[loggers]
keys = root,sqlalchemy,alembic,schakl_migrations

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# The advisory lock that serialises concurrent `alembic upgrade` (app/core/migrations.py). At the
# root's WARNING this logged nothing, which defeats the point: the wait is bounded *and*
# observable precisely so a deploy that stalls behind another instance says so in the logs
# instead of looking like a hung container.
[logger_schakl_migrations]
level = INFO
handlers =
qualname = app.core.migrations

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# schakl routing for an EXTERNAL Swarm traefik stack (companion to infra/compose.swarm.yml).
#
# Drop this on the Traefik host as /opt/traefik/config/00-schakl.yml — the same directory
# your traefik stack bind-mounts at /configuration/ and watches with
# `--providers.file.directory=/configuration/ --providers.file.watch=true`.
#
# WHY THE FILE PROVIDER AND NOT SWARM LABELS:
# the API generates /configuration/custom-domains.yml for verified customer domains
# (app/core/cloud/ingress.py), and that fragment references the file-provider service names
# `schakl-api` / `schakl-web` defined below. Routing schakl by swarm labels instead would
# leave those generated routers pointing at services that do not exist.
#
# SERVICE NAMES ARE CROSS-STACK: Traefik runs in its own stack, so the short names `api` /
# `web` do not resolve. Swarm DNS answers the qualified `<stack>_<service>` — hence
# `schakl_api` / `schakl_web`, which assumes you deployed with the stack name `schakl`.
http:
  routers:
    # API + MCP paths on ANY host: tenant subdomains, the apex console, custom domains.
    schakl-api-paths:
      rule: "PathPrefix(`/api/`) || PathPrefix(`/mcp`)"
      priority: 1000
      entryPoints: [web-secure]
      service: schakl-api
      middlewares: [compress]
      tls: {}

    # Everything else goes to the SSR web app; the Host header decides whether that renders
    # a tenant or the instance console.
    schakl-web-any:
      rule: "HostRegexp(`^.+$`)"
      priority: 1
      entryPoints: [web-secure]
      service: schakl-web
      middlewares: [compress]
      tls: {}

  middlewares:
    # Compress responses at the edge, not in the app (#290). The SSR HTML and the JSON list
    # payloads behind it are highly compressible text, and this is the one place that can
    # gzip/brotli them without a Python process spending CPU on it per request.
    #
    # Deliberately NOT FastAPI's GZipMiddleware: that would also buffer the AI assistant's SSE
    # stream (killing token-by-token delivery) and sit in front of /mcp, whose SDK owns its own
    # transport framing. Traefik's `compress` skips streamed and already-compressed responses.
    #
    # `minResponseBodyBytes` keeps the small hot responses (/prefs, /meta/me) uncompressed —
    # below ~1 KB the header and CPU cost outweighs anything saved.
    compress:
      compress:
        minResponseBodyBytes: 1024
        # The AI assistant answers as `text/event-stream` (app/core/ai/router.py). Traefik
        # already declines to compress a streamed body, but naming it here means a future
        # reader does not have to trust that: an SSE stream that gets buffered stops being a
        # stream, and the symptom is "the assistant answers all at once, late".
        excludedContentTypes:
          - text/event-stream

  services:
    schakl-api:
      loadBalancer:
        servers:
          - url: "http://schakl_api:8000"
    schakl-web:
      loadBalancer:
        servers:
          - url: "http://schakl_web:3000"

# Your Cloudflare ORIGIN certificate for <base_domain> + *.<base_domain>, serving the apex
# console and every tenant subdomain. DELETE this block if your existing tls.yml already
# declares a default certificate — two default stores in one directory is a conflict.
# tls:
#   stores:
#     default:
#       defaultCertificate:
#         certFile: /configuration/origin.pem
#         keyFile: /configuration/origin.key

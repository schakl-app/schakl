name: Release

# Build and publish container images to GHCR, then cut a GitHub Release.
# Images are built ONLY for version tags (v1.2.3, v1.2.3-rc.1) — never for branch pushes.
# The worker reuses the API image, so only two images are built: api + web.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # The two images are independent, so one failing is no reason to cancel the other.
      # fail-fast did exactly that on v0.25.0: GHCR rate-limited the api job on its fourth
      # tag and the web job was cancelled with its build already finished and nothing
      # pushed — so the retry had to rebuild an image that had been ready, and the release
      # sat with one image published and the other absent. The `release` job still needs
      # both, so a genuine failure blocks the Release either way; all this changes is that
      # the innocent half gets to finish.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Both images cross-compile (their builder stages are pinned to $BUILDPLATFORM), so
      # QEMU is now needed for exactly one instruction: the `apt-get` in the API's *runtime*
      # stage, which installs curl + the Inter face and must run on the target CPU. The web
      # image needs no emulation at all. Kept rather than engineered away because the release
      # is gated by the web build (~4 min) and the API finishes well inside that.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/schakl-app/schakl-${{ matrix.name }}
          # `latest` tracks the newest STABLE tag: a pre-release (v1.2.3-rc.1) must not
          # move it, or infra/compose.tunnel.yaml (SCHAKL_TAG:-latest) would deploy an rc.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # `continue-on-error` makes this attempt non-fatal, NOT optional: when it fails, the
      # retry below runs and *that* one decides the job. See the retry step for why one
      # exists at all.
      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Multi-arch: x86-64 hosts and ARM64 hosts (Hetzner Ampere/CAX, Apple Silicon,
          # AWS Graviton). GHCR gets a manifest list; `docker pull` picks the right variant.
          #
          # The arm64 half is CROSS-COMPILED, not emulated — see both Dockerfiles. Building
          # it under QEMU took 17 minutes: the SvelteKit build alone ran 869s emulated against
          # 148s native, to emit the same architecture-independent JavaScript, and the API's
          # wheel install 120s against 16s to download the same prebuilt aarch64 wheels.
          # Neither compiles anything from source, so neither needs the target CPU.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image as env so the running app can report what it is
          # (Settings → System). `meta.outputs.version` is the semver for a v* tag; the
          # created timestamp is the one metadata-action already put in the OCI labels, so
          # `docker inspect` and the UI can never disagree.
          build-args: |
            SCHAKL_VERSION=${{ steps.meta.outputs.version }}
            SCHAKL_GIT_SHA=${{ github.sha }}
            SCHAKL_BUILT_AT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # No build cache on purpose. `type=gha` never once hit here: this workflow runs
          # only on tags, GitHub scopes caches per ref, so every release wrote into
          # `refs/tags/vX.Y.Z` — a scope no later run can read. Both jobs reported 0 CACHED
          # layers while spending 51s (web) and 88s (api) exporting it, and 1 GB per tag was
          # crowding the repo's 10 GB budget and evicting CI's `dev`/`main` caches, which do
          # hit. Fixing the scope (registry-backed cache) would not change the verdict: a
          # release always carries changed app source, so the layer that costs the money —
          # `vite build`, `uv sync` of the project — is invalidated by definition. Measured:
          # a warm cache after a one-file source change restores `pnpm install` and rebuilds
          # everything below it. ~12s recovered on the critical path against a ~51s export.

      # GHCR refuses a rate-limited push with `denied: permission_denied` and HTTP 403 — a
      # message naming the one cause it is not, so a transient limit reads as a broken
      # GITHUB_TOKEN or a revoked package permission. Only the response *body* says what
      # happened: "You have exceeded a secondary rate limit."
      #
      # It is provoked by the shape of a release rather than by anything wrong. Each image
      # publishes four tags, every one of them a multi-arch index plus its attestation
      # manifest, and both matrix jobs push into the same namespace at the same time — so a
      # release writes some two dozen manifests in a few seconds, and the limit lands on
      # whichever write is unlucky. On v0.25.0 that was the api image's `{{major}}.{{minor}}`
      # tag, after every layer had already uploaded and `{{version}}` had already landed.
      #
      # So wait out the window and push again rather than failing a build that had done all
      # of its work. The blobs are in the registry by then, so the retry re-uploads nothing
      # and rewrites manifests. The rebuild it repeats is the price of not carrying build
      # state between steps, and a release is rare enough to pay it.
      #
      # This step is NOT `continue-on-error`: if the second attempt fails, the job fails,
      # `release` stays gated on it, and no Release is cut against images that are not there.
      #
      # The retry is unconditional on purpose. The action does not hand back *why* it failed,
      # so telling a rate limit from a compile error would mean scraping the log — and a
      # genuine build failure paying one wasted rebuild and three minutes before it reports
      # is a far better trade than a transient 403 costing a hand-driven re-run of a release.
      - name: Wait out GHCR's secondary rate limit
        if: steps.push.outcome == 'failure'
        run: |
          echo "::warning::Push failed — see above. Waiting 3 minutes for GHCR's secondary rate limit, then retrying."
          sleep 180

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SCHAKL_VERSION=${{ steps.meta.outputs.version }}
            SCHAKL_GIT_SHA=${{ github.sha }}
            SCHAKL_BUILT_AT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

  release:
    # Only publish the Release once both images are actually in GHCR, so the notes
    # never point at images that failed to build.
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac

          cat > notes.md <<EOF
          ## Container images

          \`\`\`
          ghcr.io/schakl-app/schakl-api:${version}
          ghcr.io/schakl-app/schakl-web:${version}
          \`\`\`

          Deploy with \`SCHAKL_TAG=${version}\` (see \`infra/compose.tunnel.yaml\`).

          EOF

          # Append GitHub's auto-generated changelog. Done via the API rather than
          # `--generate-notes`, which not every gh version accepts alongside --notes-file.
          gh api -X POST "repos/${REPO}/releases/generate-notes" \
            -f tag_name="$TAG" -q .body >> notes.md

          # The release may already exist: publishing from the github.com UI creates it,
          # and the resulting tag push is what triggered this run. Don't fail, and don't
          # clobber notes a human wrote there.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created in the UI) — leaving its notes alone."
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            $prerelease
